# 每日10:00北京时间 → 真实数据、每日变化、接入状态 → 固定飞书表格 + Git存档
# 失败自动重跑 1 次（job 内）；两次均失败 → 高优先级 ntfy 告警
name: SEO daily report

on:
  schedule:
    # 提前准备，整点发送；避开单一整点触发，并在上午补跑。
    - cron: "43,53 1 * * *"
    - cron: "0,7,22,37,52 2 * * *"
    - cron: "7 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/seo-daily.yml', 'scripts/seo_daily_*.py', 'scripts/seo_fetch_daily.py', 'scripts/seo_feishu_*.py', 'scripts/seo_daily_ci*.sh', 'scripts/seo_report_daily.sh', 'tests/test_daily_*.py']

concurrency:
  group: seo-daily-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  seo-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check business-day delivery receipt
        id: delivery_gate
        env:
          FEISHU_BOT_CONFIG_JSON: ${{ secrets.FEISHU_BOT_CONFIG_JSON }}
          FEISHU_BOT_APP_ID: ${{ secrets.FEISHU_BOT_APP_ID }}
          FEISHU_BOT_RECEIVE_ID: ${{ secrets.FEISHU_BOT_RECEIVE_ID }}
          FEISHU_BOT_RECEIVE_ID_TYPE: ${{ secrets.FEISHU_BOT_RECEIVE_ID_TYPE }}
        run: python3 scripts/seo_daily_delivery.py gate

      - name: Install SEO dependencies
        if: steps.delivery_gate.outputs.should_run == 'true'
        run: pip install -r scripts/requirements-seo.txt

      - name: Verify daily report failure cases
        if: steps.delivery_gate.outputs.should_run == 'true'
        run: |
          python3 tests/test_daily_reporting.py
          python3 tests/test_daily_publish.py
          python3 tests/test_daily_diagnosis.py
          python3 tests/test_daily_delivery.py

      - name: Run daily pipeline (up to 2 attempts)
        if: steps.delivery_gate.outputs.should_run == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          SEO_NOTIFY_EMAIL: ${{ secrets.SEO_NOTIFY_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_FOLDER_TOKEN: ${{ secrets.FEISHU_FOLDER_TOKEN }}
          FEISHU_SHEET_TOKEN: ${{ secrets.FEISHU_SHEET_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          echo "DAILY_PIPELINE_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          bash scripts/seo_daily_ci_with_retry.sh

      - name: Send daily highlights to Feishu bot
        if: ${{ always() && steps.delivery_gate.outputs.should_run == 'true' }}
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_SHEET_TOKEN: ${{ secrets.FEISHU_SHEET_TOKEN }}
          FEISHU_BOT_CONFIG_JSON: ${{ secrets.FEISHU_BOT_CONFIG_JSON }}
          FEISHU_BOT_APP_ID: ${{ secrets.FEISHU_BOT_APP_ID }}
          FEISHU_BOT_APP_SECRET: ${{ secrets.FEISHU_BOT_APP_SECRET }}
          FEISHU_BOT_RECEIVE_ID: ${{ secrets.FEISHU_BOT_RECEIVE_ID }}
          FEISHU_BOT_RECEIVE_ID_TYPE: ${{ secrets.FEISHU_BOT_RECEIVE_ID_TYPE }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          sys.path.insert(0, "scripts")
          from seo_daily_delivery import deliver
          path=Path("docs/seo/metrics/daily-latest.json")
          payload=json.loads(path.read_text())
          if payload.get("fetched_at") != str(datetime.now(ZoneInfo("Asia/Shanghai")).date()):
              raise SystemExit("本次采集未生成今日快照，禁止推送旧日报")
          started=os.environ.get("DAILY_PIPELINE_STARTED_AT")
          fetched=payload.get("fetched_at_iso")
          if not started or not fetched or datetime.fromisoformat(fetched) < datetime.fromisoformat(started.replace("Z", "+00:00")):
              raise SystemExit("本次执行没有新快照，禁止把历史报告冒充新采集结果")
          code=deliver(payload)
          if code==2:
              print("::error::飞书每日私聊尚未启用：缺少明确收件人配置")
              raise SystemExit(code)
          else:
              raise SystemExit(code)
          PYTHON
